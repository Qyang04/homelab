# Argo CD manages itself: chart from the argo-helm repo, values from this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/apps/argocd/values.yaml
    - repoURL: https://github.com/Qyang04/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Qyang04/homelab.git
      targetRevision: main
      path: apps/argocd/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # never let a bad commit delete Argo CD's own resources
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # Argo CD's CRDs are too large for client-side apply
