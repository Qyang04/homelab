# App-of-apps root. Applied by hand ONCE (kubectl apply -f clusters/prod/root.yaml);
# from then on Argo CD manages every Application in clusters/prod/apps/,
# including the one for Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Qyang04/homelab.git
    targetRevision: main
    path: clusters/prod/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
