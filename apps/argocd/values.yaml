# Argo CD Helm values. Chart: argo-cd 10.18.0 (Argo CD v3.6.1) from
# https://argoproj.github.io/argo-helm, deployed by clusters/prod/apps/argocd.yaml.
global:
  domain: argocd.luiqiuyang.com

# Single admin user, no SSO: drop Dex and the notifications controller (RAM).
dex:
  enabled: false
notifications:
  enabled: false
# Only plain Applications (app-of-apps) are used, not ApplicationSets.
applicationSet:
  replicas: 0

configs:
  params:
    # TLS ends at Traefik (cert-manager certificate); Argo CD serves plain HTTP inside the cluster.
    server.insecure: true

controller:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
repoServer:
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { memory: 256Mi }
server:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
