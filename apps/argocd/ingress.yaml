# Argo CD UI at https://argocd.luiqiuyang.com, tailnet only.
# DNS points at the Tailscale IP, but Traefik also listens on the public IP,
# so anyone could send "Host: argocd.luiqiuyang.com" there. The allowlist
# rejects every source outside Tailscale's 100.64.0.0/10 range (403).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: argocd
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: argocd-tailnet-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [argocd.luiqiuyang.com]
      secretName: argocd-tls
  rules:
    - host: argocd.luiqiuyang.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
