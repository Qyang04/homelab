# cert-manager Helm values. Chart: cert-manager v1.21.3 from
# https://charts.jetstack.io, deployed by clusters/prod/apps/cert-manager.yaml.
crds:
  enabled: true

# Small single-node cluster: modest requests, memory caps.
resources:
  requests: { cpu: 10m, memory: 48Mi }
  limits: { memory: 128Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }
cainjector:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }
