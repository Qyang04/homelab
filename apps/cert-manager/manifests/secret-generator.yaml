# KSOPS decrypts these SOPS files inside Argo CD's repo-server (cluster age key)
# and hands the plain Secrets to kustomize. Plaintext never touches Git.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cert-manager-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ../../../secrets/cert-manager-cloudflare.enc.yaml
