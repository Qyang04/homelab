#cloud-config
# Node bootstrap: everything from Week 0 plus k3s, as code.
# Rendered by Terraform templatefile(): the two dollar-brace placeholders are
# filled in from Terraform variables, so the secrets never live in this file.

package_update: true
package_upgrade: true
package_reboot_if_required: true # reboots once at the end if upgrades need it
packages:
  - ufw
  - unattended-upgrades # security updates; enabled by default on Ubuntu 24.04

users:
  - name: ops
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    hashed_passwd: ${ops_password_hash} # for sudo and the Contabo VNC break-glass console

disable_root: true
ssh_pwauth: false

write_files:
  - path: /etc/ssh/sshd_config.d/00-hardening.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

  # k3s settings. Secrets encrypted at rest; API cert valid for the Tailscale
  # name. Kubernetes DNATs Service traffic before ufw sees it, so NodePorts
  # would be public despite ufw: limit them to localhost and the tailnet.
  - path: /etc/rancher/k3s/config.yaml
    permissions: "0600"
    content: |
      secrets-encryption: true
      tls-san:
        - vmi3749255
      kube-proxy-arg:
        - nodeport-addresses=127.0.0.1/32,100.64.0.0/10

# Contabo merges its own config into this one: a bootcmd that sets
# "PermitRootLogin yes" in sshd_config on every boot (our 00- drop-in wins,
# first value read is used) and a chpasswd that sets a root password.
# runcmd runs after both, so it locks root's password here.
runcmd:
  - passwd -l root
  - systemctl reload ssh || true

  # Firewall: default deny in; only Tailscale, plus k3s pod/service networks.
  # ufw guards the host only: Traefik's 80/443 reach pods via k3s's own
  # iptables rules and need no ufw rule.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow in on tailscale0
  - ufw allow 41641/udp
  - ufw allow from 10.42.0.0/16 to any
  - ufw allow from 10.43.0.0/16 to any
  - ufw --force enable

  # Tailscale with Tailscale SSH. The one-time auth key tags the node, so
  # its key never expires and the tailnet policy grants SSH to tag:server.
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --ssh --auth-key=${tailscale_auth_key} --advertise-tags=tag:server

  # k3s, pinned; settings come from /etc/rancher/k3s/config.yaml above.
  - curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.37.2+k3s1 sh -s - server
